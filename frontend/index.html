    <script>
      // Global PWA prompt interceptor
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.deferredPWAInstallPrompt = null;
        console.log('Pioneer Rifle Shooting Academy App installed successfully!');
      });
    </script>
  </head>
  <body class="bg-white text-slate-800 antialiased font-sans selection:bg-[#FF6A1A] selection:text-white">

  </body>
